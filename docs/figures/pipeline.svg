<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
<title id="t">Pipeline of the thymol project with the status of every step</title>
<desc id="d">Simulation path from predicted crystal structures through molecular dynamics and the Hessian to a simulated INS spectrum, the TOSCA measurement path through reduction, and planned FTIR, Raman, VESUVIO, QENS and synthetic-data branches, all meeting in an overlay of simulation and measurement.</desc>
<style>
:root{--ink:#1C2A39;--muted:#5C6B7C;--done:#1E7B5C;--wip:#B26A00;--plan:#6C7A8D}
@media (prefers-color-scheme: dark){:root{--ink:#E6EDF3;--muted:#9AA7B5;--done:#4FC3A0;--wip:#F0B450;--plan:#9AA7B5}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.t{font-size:14px;font-weight:600} .d{font-size:12px;fill:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.s{font-size:11px;font-weight:700;letter-spacing:.04em}
.lane{font-size:13px;fill:var(--muted)}
.done rect{fill:var(--done);fill-opacity:.12;stroke:var(--done);stroke-width:1.5} .done .s{fill:var(--done)}
.wip rect{fill:var(--wip);fill-opacity:.14;stroke:var(--wip);stroke-width:1.5;stroke-dasharray:6 4} .wip .s{fill:var(--wip)}
.planned rect{fill:none;stroke:var(--plan);stroke-width:1.5;stroke-dasharray:2 4} .planned .s{fill:var(--plan)}
.e{fill:none;stroke:var(--muted);stroke-width:1.5} .e.dot{stroke-dasharray:2 4}
#a path{fill:var(--muted)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="lane" x="60" y="54">Simulation</text><text class="lane" x="60" y="246">Measurement: TOSCA</text><text class="lane" x="60" y="438">Measurement: FTIR and Raman</text><text class="lane" x="60" y="534">Measurement: VESUVIO</text>
<path class="e " d="M232,97.0  L260,97.0" marker-end="url(#a)"/><path class="e " d="M432,97.0  L460,97.0" marker-end="url(#a)"/><path class="e " d="M632,97.0  L660,97.0" marker-end="url(#a)"/><path class="e " d="M832,97.0  L860,97.0" marker-end="url(#a)"/><path class="e " d="M546.0,130  L546.0,160" marker-end="url(#a)"/><path class="e dot" d="M746.0,160  L746.0,130" marker-end="url(#a)"/><path class="e " d="M232,289.0  L260,289.0" marker-end="url(#a)"/><path class="e " d="M432,289.0  L460,289.0" marker-end="url(#a)"/><path class="e dot" d="M146.0,352  L146.0,322" marker-end="url(#a)"/><path class="e dot" d="M546.0,322  L546.0,352" marker-end="url(#a)"/><path class="e dot" d="M232,577.0  L260,577.0" marker-end="url(#a)"/><path class="e dot" d="M432,577.0  L460,577.0" marker-end="url(#a)"/><path class="e dot" d="M632,577.0  L660,577.0" marker-end="url(#a)"/><path class="e dot" d="M146.0,610 L146.0,673.0 L260,673.0" marker-end="url(#a)"/><path class="e " d="M1032,97.0 L1086.0,97.0 L1086.0,256" marker-end="url(#a)"/><path class="e " d="M632,289.0  L1000,289.0" marker-end="url(#a)"/><path class="e dot" d="M632,481.0 L970,481.0 L970,289.0"/><path class="e dot" d="M832,577.0 L970,577.0 L970,289.0"/><path class="e dot" d="M1086.0,322  L1086.0,352" marker-end="url(#a)"/>
<g class="n done"><rect x="60" y="64" width="172" height="66" rx="8"/><text class="t" x="74" y="87">Predicted structures</text><text class="d" x="74" y="105">Salager 2010, COD</text><text class="s" x="74" y="122">DONE</text></g><g class="n done"><rect x="260" y="64" width="172" height="66" rx="8"/><text class="t" x="274" y="87">PDB supercells</text><text class="d" x="274" y="105">thymol_cif/, pdb/</text><text class="s" x="274" y="122">DONE</text></g><g class="n done"><rect x="460" y="64" width="172" height="66" rx="8"/><text class="t" x="474" y="87">GAFF2 MD</text><text class="d" x="474" y="105">OpenMM, md/, 10 K</text><text class="s" x="474" y="122">DONE</text></g><g class="n done"><rect x="660" y="64" width="172" height="66" rx="8"/><text class="t" x="674" y="87">Hessian</text><text class="d" x="674" y="105">cell, supercell</text><text class="s" x="674" y="122">DONE</text></g><g class="n wip"><rect x="860" y="64" width="172" height="66" rx="8"/><text class="t" x="874" y="87">INS per detector</text><text class="d" x="874" y="105">abinslib</text><text class="s" x="874" y="122">WIP</text></g><g class="n done"><rect x="460" y="160" width="172" height="66" rx="8"/><text class="t" x="474" y="183">Vibrational DOS</text><text class="d" x="474" y="201">from velocities</text><text class="s" x="474" y="218">DONE</text></g><g class="n planned"><rect x="660" y="160" width="172" height="66" rx="8"/><text class="t" x="674" y="183">MACE potential</text><text class="d" x="674" y="201">ML force field</text><text class="s" x="674" y="218">PLANNED</text></g><g class="n done"><rect x="60" y="256" width="172" height="66" rx="8"/><text class="t" x="74" y="279">TOSCA runs</text><text class="d" x="74" y="297">two thymol runs</text><text class="s" x="74" y="314">DONE</text></g><g class="n done"><rect x="260" y="256" width="172" height="66" rx="8"/><text class="t" x="274" y="279">Reduction</text><text class="d" x="274" y="297">Mantid</text><text class="s" x="274" y="314">DONE</text></g><g class="n done"><rect x="460" y="256" width="172" height="66" rx="8"/><text class="t" x="474" y="279">Reduced spectra</text><text class="d" x="474" y="297">git-ignored</text><text class="s" x="474" y="314">DONE</text></g><g class="n planned"><rect x="60" y="352" width="172" height="66" rx="8"/><text class="t" x="74" y="375">Synthetic data</text><text class="d" x="74" y="393">stand-in runs</text><text class="s" x="74" y="410">PLANNED</text></g><g class="n planned"><rect x="460" y="352" width="172" height="66" rx="8"/><text class="t" x="474" y="375">QENS check</text><text class="d" x="474" y="393">exploratory</text><text class="s" x="474" y="410">PLANNED</text></g><g class="n planned"><rect x="460" y="448" width="172" height="66" rx="8"/><text class="t" x="474" y="471">FTIR and Raman</text><text class="d" x="474" y="489">band positions in meV</text><text class="s" x="474" y="506">PLANNED</text></g><g class="n planned"><rect x="60" y="544" width="172" height="66" rx="8"/><text class="t" x="74" y="567">VESUVIO runs</text><text class="d" x="74" y="585">foil in / foil out</text><text class="s" x="74" y="602">PLANNED</text></g><g class="n planned"><rect x="260" y="544" width="172" height="66" rx="8"/><text class="t" x="274" y="567">Foil difference</text><text class="d" x="274" y="585">Mantid LoadVesuvio</text><text class="s" x="274" y="602">PLANNED</text></g><g class="n planned"><rect x="460" y="544" width="172" height="66" rx="8"/><text class="t" x="474" y="567">Compton profiles</text><text class="d" x="474" y="585">fit per mass: H, C, O</text><text class="s" x="474" y="602">PLANNED</text></g><g class="n planned"><rect x="660" y="544" width="172" height="66" rx="8"/><text class="t" x="674" y="567">H momentum width</text><text class="d" x="674" y="585">kinetic energy of H</text><text class="s" x="674" y="602">PLANNED</text></g><g class="n planned"><rect x="260" y="640" width="172" height="66" rx="8"/><text class="t" x="274" y="663">Diffraction</text><text class="d" x="274" y="681">back angles, 0.5-8 A</text><text class="s" x="274" y="698">PLANNED</text></g><g class="n wip"><rect x="1000" y="256" width="172" height="66" rx="8"/><text class="t" x="1014" y="279">Comparison</text><text class="d" x="1014" y="297">simulation vs data</text><text class="s" x="1014" y="314">WIP</text></g><g class="n planned"><rect x="1000" y="352" width="172" height="66" rx="8"/><text class="t" x="1014" y="375">Bayesian band model</text><text class="d" x="1014" y="393">dynesty</text><text class="s" x="1014" y="410">PLANNED</text></g>
</svg>
