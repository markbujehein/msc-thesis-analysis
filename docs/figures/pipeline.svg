<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 826" role="img" aria-labelledby="t d">
<title id="t">Pipeline of the thymol project with the status of every step</title>
<desc id="d">Simulation path from predicted crystal structures through molecular dynamics and the Hessian to a simulated INS spectrum, the TOSCA measurement path through reduction, and planned FTIR, Raman, VESUVIO, QENS and synthetic-data branches, all meeting in an overlay of simulation and measurement.</desc>
<style>
:root{--ink:#1C2A39;--muted:#5C6B7C;--done:#1E7B5C;--wip:#B26A00;--plan:#6C7A8D}
@media (prefers-color-scheme: dark){:root{--ink:#E6EDF3;--muted:#9AA7B5;--done:#4FC3A0;--wip:#F0B450;--plan:#9AA7B5}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.t{font-size:14px;font-weight:600} .d{font-size:12px;fill:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.s{font-size:11px;font-weight:700;letter-spacing:.04em}
.lane{font-size:13px;fill:var(--muted)}
.done rect{fill:var(--done);fill-opacity:.12;stroke:var(--done);stroke-width:1.5} .done .s{fill:var(--done)}
.wip rect{fill:var(--wip);fill-opacity:.14;stroke:var(--wip);stroke-width:1.5;stroke-dasharray:6 4} .wip .s{fill:var(--wip)}
.planned rect{fill:none;stroke:var(--plan);stroke-width:1.5;stroke-dasharray:2 4} .planned .s{fill:var(--plan)}
.e{fill:none;stroke:var(--muted);stroke-width:1.5} .e.dot{stroke-dasharray:2 4}
#a path{fill:var(--muted)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="lane" x="60" y="30">Simulation</text><text class="lane" x="60" y="342">Measurement: TOSCA</text><text class="lane" x="60" y="534">Measurement: FTIR and Raman</text><text class="lane" x="60" y="630">Measurement: VESUVIO</text>
<path class="e " d="M232,193.0  L260,193.0" marker-end="url(#a)"/><path class="e " d="M432,193.0  L460,193.0" marker-end="url(#a)"/><path class="e " d="M632,193.0  L660,193.0" marker-end="url(#a)"/><path class="e " d="M832,193.0  L860,193.0" marker-end="url(#a)"/><path class="e " d="M546.0,226  L546.0,256" marker-end="url(#a)"/><path class="e dot" d="M546.0,122  L546.0,160" marker-end="url(#a)"/><path class="e " d="M232,385.0  L260,385.0" marker-end="url(#a)"/><path class="e " d="M432,385.0  L460,385.0" marker-end="url(#a)"/><path class="e dot" d="M146.0,448  L146.0,418" marker-end="url(#a)"/><path class="e dot" d="M546.0,418  L546.0,448" marker-end="url(#a)"/><path class="e dot" d="M232,673.0  L260,673.0" marker-end="url(#a)"/><path class="e dot" d="M432,673.0  L460,673.0" marker-end="url(#a)"/><path class="e dot" d="M632,673.0  L660,673.0" marker-end="url(#a)"/><path class="e dot" d="M146.0,706 L146.0,769.0 L260,769.0" marker-end="url(#a)"/><path class="e " d="M1032,193.0 L1086.0,193.0 L1086.0,352" marker-end="url(#a)"/><path class="e " d="M632,385.0  L1000,385.0" marker-end="url(#a)"/><path class="e dot" d="M232,577.0 L970,577.0 L970,385.0"/><path class="e dot" d="M832,673.0 L970,673.0 L970,385.0"/><path class="e dot" d="M1086.0,418  L1086.0,448" marker-end="url(#a)"/>
<g class="n done"><rect x="60" y="160" width="172" height="66" rx="8"/><text class="t" x="74" y="183">Predicted structures</text><text class="d" x="74" y="201">Salager 2010, COD</text><text class="s" x="74" y="218">DONE</text></g><g class="n done"><rect x="260" y="160" width="172" height="66" rx="8"/><text class="t" x="274" y="183">PDB supercells</text><text class="d" x="274" y="201">thymol_cif/, pdb/</text><text class="s" x="274" y="218">DONE</text></g><g class="n done"><rect x="460" y="160" width="172" height="66" rx="8"/><text class="t" x="474" y="183">GAFF2 MD</text><text class="d" x="474" y="201">OpenMM, md/, 10 K</text><text class="s" x="474" y="218">DONE</text></g><g class="n done"><rect x="660" y="160" width="172" height="66" rx="8"/><text class="t" x="674" y="183">Hessian</text><text class="d" x="674" y="201">cell, supercell</text><text class="s" x="674" y="218">DONE</text></g><g class="n wip"><rect x="860" y="160" width="172" height="66" rx="8"/><text class="t" x="874" y="183">INS per detector</text><text class="d" x="874" y="201">abinslib</text><text class="s" x="874" y="218">WIP</text></g><g class="n done"><rect x="460" y="256" width="172" height="66" rx="8"/><text class="t" x="474" y="279">Vibrational DOS</text><text class="d" x="474" y="297">from velocities</text><text class="s" x="474" y="314">DONE</text></g><g class="n planned"><rect x="460" y="40" width="172" height="82" rx="8"/><text class="t" x="474" y="63">Other force fields</text><text class="d" x="474" y="81">MACE and others</text><text class="d" x="474" y="97">for higher accuracy</text><text class="s" x="474" y="114">PLANNED</text></g><g class="n done"><rect x="60" y="352" width="172" height="66" rx="8"/><text class="t" x="74" y="375">TOSCA runs</text><text class="d" x="74" y="393">two thymol runs</text><text class="s" x="74" y="410">DONE</text></g><g class="n done"><rect x="260" y="352" width="172" height="66" rx="8"/><text class="t" x="274" y="375">Reduction</text><text class="d" x="274" y="393">Mantid</text><text class="s" x="274" y="410">DONE</text></g><g class="n done"><rect x="460" y="352" width="172" height="66" rx="8"/><text class="t" x="474" y="375">Reduced spectra</text><text class="d" x="474" y="393">git-ignored</text><text class="s" x="474" y="410">DONE</text></g><g class="n planned"><rect x="60" y="448" width="172" height="66" rx="8"/><text class="t" x="74" y="471">Synthetic data</text><text class="d" x="74" y="489">stand-in runs</text><text class="s" x="74" y="506">PLANNED</text></g><g class="n planned"><rect x="460" y="448" width="172" height="66" rx="8"/><text class="t" x="474" y="471">QENS check</text><text class="d" x="474" y="489">exploratory</text><text class="s" x="474" y="506">PLANNED</text></g><g class="n planned"><rect x="60" y="544" width="172" height="66" rx="8"/><text class="t" x="74" y="567">FTIR and Raman</text><text class="d" x="74" y="585">band positions in meV</text><text class="s" x="74" y="602">PLANNED</text></g><g class="n planned"><rect x="60" y="640" width="172" height="66" rx="8"/><text class="t" x="74" y="663">VESUVIO runs</text><text class="d" x="74" y="681">foil in / foil out</text><text class="s" x="74" y="698">PLANNED</text></g><g class="n planned"><rect x="260" y="640" width="172" height="66" rx="8"/><text class="t" x="274" y="663">Foil difference</text><text class="d" x="274" y="681">Mantid LoadVesuvio</text><text class="s" x="274" y="698">PLANNED</text></g><g class="n planned"><rect x="460" y="640" width="172" height="66" rx="8"/><text class="t" x="474" y="663">Compton profiles</text><text class="d" x="474" y="681">fit per mass: H, C, O</text><text class="s" x="474" y="698">PLANNED</text></g><g class="n planned"><rect x="660" y="640" width="172" height="66" rx="8"/><text class="t" x="674" y="663">H momentum width</text><text class="d" x="674" y="681">kinetic energy of H</text><text class="s" x="674" y="698">PLANNED</text></g><g class="n planned"><rect x="260" y="736" width="172" height="66" rx="8"/><text class="t" x="274" y="759">Diffraction</text><text class="d" x="274" y="777">back angles, 0.5-8 A</text><text class="s" x="274" y="794">PLANNED</text></g><g class="n wip"><rect x="1000" y="352" width="172" height="66" rx="8"/><text class="t" x="1014" y="375">Comparison</text><text class="d" x="1014" y="393">simulation vs data</text><text class="s" x="1014" y="410">WIP</text></g><g class="n planned"><rect x="1000" y="448" width="172" height="66" rx="8"/><text class="t" x="1014" y="471">Bayesian band model</text><text class="d" x="1014" y="489">dynesty</text><text class="s" x="1014" y="506">PLANNED</text></g>
</svg>
